name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: knowledge.md mirrors AGENTS.md
        run: pnpm check:knowledge

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit + API tests
        run: pnpm test

      - name: Build web + api
        run: pnpm build

  database:
    name: Migrations, seed, RLS tests, DB types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Only what the tests need: Postgres, Auth (auth schema), Storage (storage schema),
      # REST + postgres-meta (type generation).
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime

      - name: Apply all migrations + seed on a fresh database
        run: supabase db reset

      - name: RLS + schema tests (pgTAP)
        run: supabase test db

      - name: Generated DB types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/db.types.ts
          # PostgrestVersion differs between the local stack and hosted projects; ignore that line.
          if ! diff -u <(grep -v PostgrestVersion packages/shared/src/db.types.ts) <(grep -v PostgrestVersion /tmp/db.types.ts); then
            echo "::error::packages/shared/src/db.types.ts is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi

  embedder:
    name: Python embedder (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/embedder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/embedder/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: ruff format --check .

      - run: pytest -q
