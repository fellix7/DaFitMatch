packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default; allow only what we need.
allowBuilds:
  core-js: true
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.121'
  - '@ai-sdk/openai@4.0.99'
  - '@ai-sdk/provider-utils@5.0.65'
  - ai@7.0.148
  - posthog-js@1.438.13
